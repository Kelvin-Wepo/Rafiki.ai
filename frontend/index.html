<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rafiki AI - Government Services Assistant</title>
    <!-- DNS prefetch for external APIs -->
    <link rel="dns-prefetch" href="https://api.elevenlabs.io">
    <link rel="dns-prefetch" href="https://generativelanguage.googleapis.com">
    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Fonts: Playfair Display + DM Sans (Rafiki Auth Theme) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
    <style>
      /* Initial loading screen — styled to match the "Savanna at Dawn"
         theme (cream/gold) so the handoff to the app is a subtle fade,
         not a dark→light flash */
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #FAF3E0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(200, 134, 10, 0.2);
        border-top-color: #C8860A;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .loader-text {
        margin-top: 20px;
        color: #6B7280;
        font-family: 'DM Sans', system-ui, sans-serif;
        font-size: 16px;
        text-align: center;
      }
      .loader-title {
        font-family: 'Baloo 2', 'DM Sans', system-ui, sans-serif;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 10px;
      }
      .loader-subtitle {
        color: #6B7280;
        font-size: 14px;
        margin-top: 8px;
        font-family: 'DM Sans', system-ui, sans-serif;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen shown before React loads -->
    <div id="initial-loader">
      <div class="loader-title" aria-label="Rafiki"><span style="color:#161616">r</span><span style="color:#C8102E">a</span><span style="color:#161616">f</span><span style="color:#007A33">i</span><span style="color:#C8102E">k</span><span style="color:#161616">i</span></div>
      <div class="loader-spinner"></div>
      <div class="loader-text">Loading your government assistant...</div>
      <div class="loader-subtitle">This may take a moment on first visit</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide loader when React app is ready
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader) loader.classList.add('hidden');
        }, 500);
      });
    </script>
  </body>
</html>
