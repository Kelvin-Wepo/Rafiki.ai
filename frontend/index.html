<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rafiki AI - Government Services Assistant</title>
    <!-- DNS prefetch for external APIs -->
    <link rel="dns-prefetch" href="https://api.elevenlabs.io">
    <link rel="dns-prefetch" href="https://generativelanguage.googleapis.com">
    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* Initial loading screen */
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader-spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .loader-text {
        margin-top: 20px;
        color: #94a3b8;
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        text-align: center;
      }
      .loader-title {
        color: #10b981;
        font-family: 'Inter', sans-serif;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      .loader-subtitle {
        color: #64748b;
        font-size: 14px;
        margin-top: 8px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen shown before React loads -->
    <div id="initial-loader">
      <div class="loader-title">🇰🇪 Rafiki AI</div>
      <div class="loader-spinner"></div>
      <div class="loader-text">Loading your government assistant...</div>
      <div class="loader-subtitle">This may take a moment on first visit</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide loader when React app is ready
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader) loader.classList.add('hidden');
        }, 500);
      });
    </script>
  </body>
</html>
