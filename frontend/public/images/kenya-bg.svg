<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Kenya Flag Colors -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#006600;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00cc00;stop-opacity:0.1" />
    </linearGradient>
    
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bb0000;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ff4444;stop-opacity:0.05" />
    </linearGradient>
    
    <!-- Woman silhouette gradient -->
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3436;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#636e72;stop-opacity:0.7" />
    </linearGradient>
    
    <!-- Phone glow -->
    <radialGradient id="phoneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00cc00;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#006600;stop-opacity:0" />
    </radialGradient>
    
    <!-- Screen light -->
    <linearGradient id="screenLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#00ff00;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  
  <!-- Kenya flag diagonal stripes (subtle background) -->
  <g opacity="0.15">
    <rect x="0" y="0" width="1920" height="270" fill="#000000"/>
    <rect x="0" y="280" width="1920" height="250" fill="#bb0000"/>
    <rect x="0" y="540" width="1920" height="270" fill="#006600"/>
  </g>
  
  <!-- Decorative circles with Kenya colors -->
  <circle cx="1600" cy="200" r="300" fill="url(#redGlow)" opacity="0.5"/>
  <circle cx="200" cy="800" r="400" fill="url(#greenGlow)" opacity="0.4"/>
  <circle cx="1700" cy="900" r="200" fill="url(#greenGlow)" opacity="0.3"/>
  
  <!-- Grid pattern (digital/tech feel) -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="200" x2="1920" y2="200"/>
    <line x1="0" y1="400" x2="1920" y2="400"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="1080"/>
    <line x1="800" y1="0" x2="800" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
  </g>
  
  <!-- Kenyan Woman Silhouette (on right side) -->
  <g transform="translate(1100, 80)">
    <!-- Body/Dress -->
    <path d="M350,350 
             C320,380 280,450 270,550
             C260,650 250,750 240,900
             L500,900
             C490,750 480,650 470,550
             C460,450 420,380 390,350
             Z" 
          fill="url(#personGrad)" opacity="0.85"/>
    
    <!-- Head -->
    <ellipse cx="370" cy="280" rx="70" ry="85" fill="url(#personGrad)" opacity="0.9"/>
    
    <!-- Hair (African style - short/natural) -->
    <path d="M300,250 
             C290,200 320,160 370,155
             C420,160 450,200 440,250
             C435,220 410,190 370,185
             C330,190 305,220 300,250
             Z"
          fill="#1a1a1a" opacity="0.95"/>
    
    <!-- Arm holding phone -->
    <path d="M320,420 
             C280,440 240,480 220,520
             C200,560 195,600 200,620
             L240,630
             C235,610 245,570 265,530
             C285,490 320,455 350,440
             Z"
          fill="url(#personGrad)" opacity="0.85"/>
    
    <!-- Hand -->
    <ellipse cx="210" cy="615" rx="25" ry="20" fill="#5d4e37" opacity="0.9"/>
    
    <!-- Phone -->
    <g transform="translate(175, 560)">
      <!-- Phone glow effect -->
      <ellipse cx="35" cy="55" rx="60" ry="70" fill="url(#phoneGlow)"/>
      
      <!-- Phone body -->
      <rect x="5" y="5" width="60" height="100" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
      
      <!-- Screen -->
      <rect x="10" y="15" width="50" height="80" rx="4" fill="url(#screenLight)" opacity="0.9"/>
      
      <!-- Screen content (Rafiki.ai interface) -->
      <rect x="15" y="25" width="40" height="8" rx="2" fill="#006600" opacity="0.8"/>
      <rect x="15" y="38" width="30" height="5" rx="1" fill="#333" opacity="0.5"/>
      <rect x="15" y="48" width="35" height="5" rx="1" fill="#333" opacity="0.5"/>
      <rect x="15" y="58" width="25" height="5" rx="1" fill="#333" opacity="0.5"/>
      
      <!-- Send button -->
      <circle cx="35" cy="78" r="8" fill="#006600" opacity="0.9"/>
      <polygon points="32,78 38,75 38,81" fill="white"/>
    </g>
    
    <!-- Decorative earring -->
    <circle cx="300" cy="300" r="8" fill="#ffd700" opacity="0.8"/>
    
    <!-- Necklace hint -->
    <path d="M320,365 Q370,385 420,365" stroke="#ffd700" stroke-width="3" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Kenya Coat of Arms (simplified, top left) -->
  <g transform="translate(80, 80)" opacity="0.15">
    <ellipse cx="60" cy="50" rx="50" ry="40" fill="none" stroke="white" stroke-width="2"/>
    <path d="M60,10 L60,90" stroke="white" stroke-width="3"/>
    <path d="M30,35 L90,65" stroke="white" stroke-width="2"/>
    <path d="M30,65 L90,35" stroke="white" stroke-width="2"/>
    <!-- Spears -->
    <line x1="20" y1="100" x2="60" y2="10" stroke="white" stroke-width="2"/>
    <line x1="100" y1="100" x2="60" y2="10" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- "HARAMBEE" text suggestion (very subtle) -->
  <text x="80" y="200" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.1" letter-spacing="8">HARAMBEE</text>
  
  <!-- Digital connection lines (from phone) -->
  <g stroke="#00cc00" stroke-width="1" opacity="0.3">
    <path d="M1310,680 Q1400,600 1500,580" fill="none" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M1310,680 Q1350,750 1450,800" fill="none" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M1310,680 Q1200,600 1100,500" fill="none" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Floating particles (digital feel) -->
  <g fill="#00cc00" opacity="0.4">
    <circle cx="1500" cy="400" r="3">
      <animate attributeName="cy" values="400;380;400" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1600" cy="300" r="2">
      <animate attributeName="cy" values="300;320;300" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1450" cy="500" r="4">
      <animate attributeName="cy" values="500;480;500" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1550" cy="700" r="2">
      <animate attributeName="cy" values="700;720;700" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Kenya flag icon (bottom right corner) -->
  <g transform="translate(1750, 950)">
    <rect x="0" y="0" width="120" height="80" fill="#000000" rx="4"/>
    <rect x="0" y="20" width="120" height="5" fill="#ffffff"/>
    <rect x="0" y="25" width="120" height="30" fill="#bb0000"/>
    <rect x="0" y="55" width="120" height="5" fill="#ffffff"/>
    <rect x="0" y="60" width="120" height="20" fill="#006600"/>
    <!-- Shield -->
    <ellipse cx="60" cy="40" rx="18" ry="22" fill="none" stroke="white" stroke-width="2"/>
    <line x1="45" y1="40" x2="75" y2="40" stroke="white" stroke-width="1.5"/>
    <line x1="60" y1="20" x2="60" y2="60" stroke="white" stroke-width="1.5"/>
  </g>
</svg>
