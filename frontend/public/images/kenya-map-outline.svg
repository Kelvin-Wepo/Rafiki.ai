  <!--
    Simplified silhouette of Kenya, used as a faint watermark behind the
    hero artwork. Vertices are plotted from approximate national boundary
    coordinates with x = (lon - 33.8) * 48 and y = (5.0 - lat) * 48, so the
    proportions read correctly: pointed Mandera corner in the north east,
    the Indian Ocean coast running south west to the Tanzania border, the
    long straight Tanzania border, and the Lake Victoria notch in the west.
    Decorative only - never announced to assistive technology.
  -->
