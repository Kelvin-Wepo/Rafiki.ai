services:
  # Backend API Service
  - type: web
    name: rafiki-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-exp
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: ELEVENLABS_BRANCH_ID
        sync: false
      - key: AFRICASTALKING_USERNAME
        value: sandbox
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: COLAB_SADTALKER_URL
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        fromService:
          type: web
          name: rafiki-backend
          property: port
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: https://rafiki-frontend.onrender.com,http://localhost:5173
    healthCheckPath: /health

  # Frontend Static Site
  - type: web
    name: rafiki-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: VITE_API_BASE_URL
        value: https://rafiki-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
