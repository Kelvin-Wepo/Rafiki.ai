# NOTE: the live deployment (service "Rafiki.ai", https://rafiki-ai-1w68.onrender.com)
# was provisioned manually via the Render API using the native Python runtime below
# (buildCommand/startCommand), not the Docker runtime. Both are valid; this file
# documents the native-Python path actually in use. Update names/URLs here if you
# ever adopt Render's Blueprint sync for this repo.
services:
  # Backend API Service
  - type: web
    name: rafiki-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements-prod.txt
    startCommand: bash start-render.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: rafiki-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-exp
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: ELEVENLABS_BRANCH_ID
        sync: false
      - key: AFRICASTALKING_USERNAME
        value: sandbox
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: COLAB_SADTALKER_URL
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: https://rafiki-frontend-gbp1.onrender.com,http://localhost:5173
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET_KEY
        generateValue: true
    healthCheckPath: /health

  # Frontend Static Site
  - type: web
    name: rafiki-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://rafiki-ai-1w68.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# PostgreSQL Database
databases:
  - name: rafiki-db
    region: oregon
    plan: free
    databaseName: rafiki
    user: rafiki_user
