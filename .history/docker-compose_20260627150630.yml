version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: rafiki-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rafiki
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rafiki-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rafiki-backend
    ports:
      - "8000:8000"
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/rafiki
      
      # API Keys (set these in .env file)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - DIALOGFLOW_PROJECT_ID=${DIALOGFLOW_PROJECT_ID}
      - AFRICASTALKING_USERNAME=${AFRICASTALKING_USERNAME:-sandbox}
      - AFRICASTALKING_API_KEY=${AFRICASTALKING_API_KEY}
      
      # SadTalker Configuration
      - COLAB_SADTALKER_URL=${COLAB_SADTALKER_URL:-}
      - SADTALKER_MODE=audio  # Options: colab, direct, audio
      
      # Other settings
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      
    volumes:
      # Mount assets directory for persistent storage
      - ./backend/assets:/app/backend/assets
      # Mount service account if exists
      - ./backend/service-account.json:/app/backend/service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rafiki-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rafiki-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - rafiki-network

networks:
  rafiki-network:
    driver: bridge

volumes:
  postgres_data:
  avatar-assets:
